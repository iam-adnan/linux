# Self-contained secret scan.
#
# WHY THIS IS NOT A THIN CALLER: the engine's reusable workflow lives in a
# PRIVATE repo (iam-adnan/CodeReviewer). A cross-repo `uses:` is resolved at
# parse time with the caller's own GITHUB_TOKEN, which cannot read a private
# repo — the run fails with a workflow-file error and zero jobs, before any
# step executes. Granting Actions "access_level: user" on the engine did not
# satisfy it. Checking the engine out at RUNTIME with ENGINE_CHECKOUT_TOKEN
# does work, so the engine's steps are inlined here instead.
#
# Tradeoff: this consumer no longer tracks the engine's workflow YAML
# automatically — only its Node code (checked out from @main below). Keep in
# sync with engine .github/workflows/secret-scan.yml if that changes.
name: Secret Scan

on:
  pull_request:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]          # enables the manual `@secret-scan run` re-run command

permissions:
  contents: read
  pull-requests: write

env:
  # Pinned + checksum-verified. Must match the engine's src/org-scan.js.
  BETTERLEAKS_VERSION: '1.6.1'
  BETTERLEAKS_SHA256: 'fbefc700a0bd4522cc952dd2a8f259cdb80526d7e60114aca19bb2d6fdc80f81'

jobs:
  scan:
    if: >
      github.event_name == 'pull_request' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request != null &&
       contains(github.event.comment.body, '@secret-scan run'))
    # Serialize per-PR so the sticky-comment upsert can't race and duplicate.
    concurrency:
      group: secret-scan-${{ github.event.pull_request.number || github.event.issue.number }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    # The engine has no timeout; a wedged 6 GB clone would otherwise burn the
    # full 6-hour job cap before failing.
    timeout-minutes: 60
    steps:
      - name: Guard — required secret present
        id: guard
        env:
          PAT: ${{ secrets.ENGINE_CHECKOUT_TOKEN }}
        run: |
          if [ -z "$PAT" ]; then
            echo "::error title=Secret scan skipped::No ENGINE_CHECKOUT_TOKEN available."
            exit 1
          fi

      - name: Resolve PR head (for comment re-runs)
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "issue_comment" ]; then
            sha=$(gh pr view "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --json headRefOid -q .headRefOid)
            echo "head_sha=$sha" >> "$GITHUB_OUTPUT"
          else
            echo "head_sha=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Disk before checkout (BUG-21 diagnostic)
        run: df -h /

      - name: Checkout PR code (caller repo, at workspace root)
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: ${{ steps.pr.outputs.head_sha }}
          fetch-depth: 0   # the scan walks base..head history

      - name: Disk after checkout
        run: df -h /

      - name: Checkout reviewer engine (runtime, authenticated — works on a private repo)
        uses: actions/checkout@v4
        with:
          repository: iam-adnan/CodeReviewer
          ref: main
          path: engine
          token: ${{ secrets.ENGINE_CHECKOUT_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install engine deps
        working-directory: engine
        run: npm ci

      - name: Install Betterleaks (pinned, checksum-verified)
        working-directory: ${{ runner.temp }}
        run: |
          v="$BETTERLEAKS_VERSION"
          curl -sSfL -O "https://github.com/betterleaks/betterleaks/releases/download/v${v}/betterleaks_${v}_linux_x64.tar.gz"
          echo "$BETTERLEAKS_SHA256  betterleaks_${v}_linux_x64.tar.gz" | sha256sum -c -
          tar -xzf "betterleaks_${v}_linux_x64.tar.gz" betterleaks
          echo "${{ runner.temp }}" >> "$GITHUB_PATH"

      - name: Stage 1 — scan PR commits
        id: scan
        env:
          GH_TOKEN: ${{ github.token }}
        run: node engine/bin/secret-scan.js

      # always() so a Stage-1 failure still reports (findings AND crashes both
      # exit non-zero there); skip when the guard tripped — no write token.
      - name: Stage 2 — post sticky comment
        if: always() && steps.guard.outcome != 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node engine/bin/post-scan-comment.js
