# Self-contained secret scan, tuned for a large repo.
#
# WHY NOT A THIN CALLER: the engine's reusable workflow lives in a PRIVATE repo
# (iam-adnan/CodeReviewer). A cross-repo `uses:` is resolved at parse time with
# the caller's own GITHUB_TOKEN, which cannot read a private repo — the run
# fails with a workflow-file error and zero jobs. Checking the engine out at
# RUNTIME with ENGINE_CHECKOUT_TOKEN does work, so its steps are inlined here,
# mirroring iam-adnan/CodeReviewer's own .github/workflows/secret-scan.yml.
#
# Only calls engine scripts that actually exist in iam-adnan/CodeReviewer@main
# (bin/secret-scan.js, bin/post-scan-comment.js) — the previous version of this
# file also called bin/coverage-guard.js and bin/post-findings.js, neither of
# which exists in the engine repo, so every run failed at that step.
name: Secret Scan

on:
  pull_request:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]          # enables the manual `@secret-scan run` re-run command

permissions:
  contents: read
  pull-requests: write

env:
  # Pinned + checksum-verified. Must match the engine's secret-scan.yml.
  BETTERLEAKS_VERSION: '1.6.1'
  BETTERLEAKS_SHA256: 'fbefc700a0bd4522cc952dd2a8f259cdb80526d7e60114aca19bb2d6fdc80f81'

jobs:
  scan:
    if: >
      github.event_name == 'pull_request' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request != null &&
       contains(github.event.comment.body, '@secret-scan run'))
    concurrency:
      group: secret-scan-${{ github.event.pull_request.number || github.event.issue.number }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Guard — required secret present
        id: guard
        env:
          PAT: ${{ secrets.ENGINE_CHECKOUT_TOKEN }}
        run: |
          if [ -z "$PAT" ]; then
            echo "::error title=Secret scan skipped::No ENGINE_CHECKOUT_TOKEN available."
            exit 1
          fi

      - name: Resolve PR head (for comment re-runs)
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "issue_comment" ]; then
            sha=$(gh pr view "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --json headRefOid -q .headRefOid)
            echo "head_sha=$sha" >> "$GITHUB_OUTPUT"
          else
            echo "head_sha=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
          fi

      # Matches the engine's own approach: full history (blob:none) so the scan
      # can walk base..head, no working tree materialised (betterleaks reads
      # the object database, not files on disk).
      - name: Checkout PR code (blobless, no working tree)
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: ${{ steps.pr.outputs.head_sha }}
          fetch-depth: 0
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.git

      - name: Checkout reviewer engine (runtime, authenticated — works on a private repo)
        uses: actions/checkout@v4
        with:
          repository: iam-adnan/CodeReviewer
          ref: main
          path: engine
          token: ${{ secrets.ENGINE_CHECKOUT_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install engine deps
        working-directory: engine
        run: npm ci

      - name: Cache Betterleaks
        id: bl-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/betterleaks
          key: betterleaks-${{ env.BETTERLEAKS_VERSION }}-linux-x64

      - name: Install Betterleaks (pinned, checksum-verified)
        if: steps.bl-cache.outputs.cache-hit != 'true'
        working-directory: ${{ runner.temp }}
        run: |
          v="$BETTERLEAKS_VERSION"
          curl -sSfL -O "https://github.com/betterleaks/betterleaks/releases/download/v${v}/betterleaks_${v}_linux_x64.tar.gz"
          echo "$BETTERLEAKS_SHA256  betterleaks_${v}_linux_x64.tar.gz" | sha256sum -c -
          tar -xzf "betterleaks_${v}_linux_x64.tar.gz" betterleaks

      - name: Put Betterleaks on PATH
        run: echo "${{ runner.temp }}" >> "$GITHUB_PATH"

      - name: Stage 1 — scan PR commits
        id: scan
        env:
          GH_TOKEN: ${{ github.token }}
        run: node engine/bin/secret-scan.js

      - name: Stage 2 — post sticky comment
        if: always() && steps.guard.outcome != 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node engine/bin/post-scan-comment.js
