# Thin caller: delegates to the CodeReviewer engine's reusable secret-scan.
# Scans every commit in the PR's base..head range, not just the diff at HEAD.
name: Secret Scan

on:
  pull_request:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]          # enables the manual `@secret-scan run` re-run command

# Reusable-workflow token permissions are capped by the caller, so grant them
# here too. No id-token needed — this workflow has no Claude step.
permissions:
  contents: read
  pull-requests: write

jobs:
  scan:
    uses: iam-adnan/CodeReviewer/.github/workflows/secret-scan.yml@main
    secrets: inherit          # forwards ENGINE_CHECKOUT_TOKEN
