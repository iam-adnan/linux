# Self-contained secret scan, tuned for a large repo.
#
# WHY NOT A THIN CALLER: the engine's reusable workflow lives in a PRIVATE repo
# (iam-adnan/CodeReviewer). A cross-repo `uses:` is resolved at parse time with
# the caller's own GITHUB_TOKEN, which cannot read a private repo — the run
# fails with a workflow-file error and zero jobs. Granting Actions
# "access_level: user" on the engine did not satisfy it. Checking the engine out
# at RUNTIME with ENGINE_CHECKOUT_TOKEN does work, so its steps are inlined.
#
# WHY NOT fetch-depth: 0 (the engine default): measured on this repo, a full
# checkout costs 7m56s of a ~8m10s job, while the scan itself reads 6 KB in
# 412ms. The scan only ever walks origin/<base>..<head>, so the other 1.4M
# commits are pure cost.
#
# COVERAGE IS NOT TRADED AWAY. A shallow clone whose boundary falls between the
# base and head makes `git rev-list --count base..head` return a SMALLER number,
# and the engine treats a count of 0 as "clean" — a truncated range would report
# green. The guard step below therefore proves the merge base is present before
# any scanning, deepens if it is not, and FAILS LOUD rather than scan a partial
# range. Same commits scanned as a full clone, or no scan at all.
name: Secret Scan

on:
  pull_request:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]          # enables the manual `@secret-scan run` re-run command

permissions:
  contents: read
  pull-requests: write

env:
  # Pinned + checksum-verified. Must match the engine's src/org-scan.js.
  BETTERLEAKS_VERSION: '1.6.1'
  BETTERLEAKS_SHA256: 'fbefc700a0bd4522cc952dd2a8f259cdb80526d7e60114aca19bb2d6fdc80f81'

jobs:
  scan:
    if: >
      github.event_name == 'pull_request' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request != null &&
       contains(github.event.comment.body, '@secret-scan run'))
    concurrency:
      group: secret-scan-${{ github.event.pull_request.number || github.event.issue.number }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Guard — required secret present
        id: guard
        env:
          PAT: ${{ secrets.ENGINE_CHECKOUT_TOKEN }}
        run: |
          if [ -z "$PAT" ]; then
            echo "::error title=Secret scan skipped::No ENGINE_CHECKOUT_TOKEN available."
            exit 1
          fi

      # Emits head_sha, base_ref, and the fetch depth. Depth comes from the PR's
      # own commit count (+2 margin), not a guess; the guard step below is what
      # makes an under-estimate safe.
      - name: Resolve PR head, base and depth
        id: pr
        env:
          # Passed via env, never interpolated into the script: ${{ }} expands
          # before bash parses, and git permits single quotes in ref names.
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_COMMITS: ${{ github.event.pull_request.commits }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "issue_comment" ]; then
            read -r sha base < <(gh pr view "$ISSUE_NUMBER" --repo "$REPO"               --json headRefOid,baseRefName -q '[.headRefOid, .baseRefName] | @tsv')
            commits=$(gh api "repos/$REPO/pulls/$ISSUE_NUMBER" --jq '.commits')
          else
            sha="$PR_HEAD_SHA"; base="$PR_BASE_REF"; commits="$PR_COMMITS"
          fi
          echo "head_sha=$sha"          >> "$GITHUB_OUTPUT"
          echo "base_ref=$base"         >> "$GITHUB_OUTPUT"
          echo "commits=$commits"       >> "$GITHUB_OUTPUT"
          echo "depth=$((commits + 2))" >> "$GITHUB_OUTPUT"
          echo "Resolved head=$sha base=$base commits=$commits depth=$((commits + 2))"

      # filter=blob:none -> commit/tree objects only; file contents arrive on
      # demand, so the scan pays for the 6 KB it reads instead of 1.3 GB of tree.
      # sparse-checkout keeps git from materialising 96k working-tree files;
      # betterleaks git-mode reads the object database, not the worktree.
      - name: Checkout PR code (shallow, blobless, sparse)
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: ${{ steps.pr.outputs.head_sha }}
          fetch-depth: ${{ steps.pr.outputs.depth }}
          filter: blob:none
          sparse-checkout: .github
          sparse-checkout-cone-mode: true


      - name: Disk + repo size
        run: |
          df -h / | tail -1
          echo "git dir: $(du -sh .git | cut -f1)"

      - name: Checkout reviewer engine (runtime, authenticated — works on a private repo)
        uses: actions/checkout@v4
        with:
          repository: iam-adnan/CodeReviewer
          ref: main
          path: engine
          token: ${{ secrets.ENGINE_CHECKOUT_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install engine deps
        working-directory: engine
        run: npm ci

      # Cached so a warm run skips the download + checksum entirely.
      - name: Cache Betterleaks
        id: bl-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/betterleaks
          key: betterleaks-${{ env.BETTERLEAKS_VERSION }}-linux-x64

      - name: Install Betterleaks (pinned, checksum-verified)
        if: steps.bl-cache.outputs.cache-hit != 'true'
        working-directory: ${{ runner.temp }}
        run: |
          v="$BETTERLEAKS_VERSION"
          curl -sSfL -O "https://github.com/betterleaks/betterleaks/releases/download/v${v}/betterleaks_${v}_linux_x64.tar.gz"
          echo "$BETTERLEAKS_SHA256  betterleaks_${v}_linux_x64.tar.gz" | sha256sum -c -
          tar -xzf "betterleaks_${v}_linux_x64.tar.gz" betterleaks

      - name: Put Betterleaks on PATH
        run: echo "${{ runner.temp }}" >> "$GITHUB_PATH"

      # Merge-base reachability is not range coverage, and neither is a >= count:
      # reproduced in a scratch repo, a 4-commit PR that merged base in gave a
      # count of 6 at depth 6, because the exclusion walk from origin/base stops
      # at BASE's graft. Too few = HEAD truncated (under-report); too many = base
      # graft inflating it (over-report, blaming this PR for a leak on main). So
      # the count must match EXACTLY; deepening resolves both (verified 6 -> 4).
      # Runs after npm ci so a failure here still leaves Stage 2 able to comment.
      - name: Coverage guard — prove the exact commit range is present
        id: coverage
        env:
          BASE: ${{ steps.pr.outputs.base_ref }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
          DEPTH: ${{ steps.pr.outputs.depth }}
          EXPECTED: ${{ steps.pr.outputs.commits }}
        run: |
          set -uo pipefail
          git fetch --no-tags --depth="$DEPTH" origin "$BASE"
          proven=""
          for attempt in 1 2 3 4 5; do
            if git merge-base "origin/$BASE" "$HEAD_SHA" >/dev/null 2>&1; then
              count=$(git rev-list --count "origin/$BASE..$HEAD_SHA")
              if [ "$count" -eq "$EXPECTED" ]; then
                echo "Coverage proven: range holds exactly $count commit(s), matching the PR."
                proven=yes; break
              fi
              if [ "$count" -lt "$EXPECTED" ]; then
                echo "Range holds only $count of the PR's $EXPECTED commit(s) — HEAD is truncated."
              else
                echo "Range holds $count commit(s) but the PR has $EXPECTED — base graft is inflating it."
              fi
            else
              echo "Merge base not reachable from the shallow graft."
            fi
            echo "Deepening (attempt $attempt)…"
            git fetch --no-tags --deepen=250 origin "$BASE" || true
            git fetch --no-tags --deepen=250 origin "$HEAD_SHA" || true
          done
          if [ -z "$proven" ]; then
            echo "Deepen ceiling reached — falling back to a full fetch."
            git fetch --no-tags --unshallow origin "$BASE" 2>/dev/null || git fetch --no-tags --unshallow || true
            if git merge-base "origin/$BASE" "$HEAD_SHA" >/dev/null 2>&1; then
              count=$(git rev-list --count "origin/$BASE..$HEAD_SHA")
              [ "$count" -eq "$EXPECTED" ] && { echo "Coverage proven after a full fetch: $count commit(s)."; proven=yes; }
            fi
          fi
          if [ -z "$proven" ]; then
            echo "::error title=Secret scan aborted::Could not prove exact coverage of origin/$BASE..$HEAD_SHA even after a full fetch (PR reports $EXPECTED commit(s))."
            exit 1
          fi

      - name: Stage 1 — scan PR commits
        id: scan
        env:
          GH_TOKEN: ${{ github.token }}
        run: node engine/bin/secret-scan.js

      - name: Stage 2 — post sticky comment
        if: always() && steps.guard.outcome != 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node engine/bin/post-scan-comment.js

      # Reporting side-channel, deliberately last and deliberately non-blocking:
      # always() so findings are reported even though Stage 1 exits non-zero, and
      # the script always exits 0 so a dashboard outage cannot turn a clean
      # security check red. Sends a MASKED payload only.
      - name: Stage 3 — post masked findings to the dashboard
        if: always() && steps.guard.outcome != 'failure'
        env:
          DASHBOARD_URL: ${{ secrets.DASHBOARD_URL }}
          DASHBOARD_TOKEN: ${{ secrets.DASHBOARD_TOKEN }}
        run: node engine/bin/post-findings.js
